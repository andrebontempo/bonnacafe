services:
  bonnacafe:
    build: .
    container_name: bonnacafe
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_PASSWORD=bonna123
    volumes:
      - ./data:/app/data
    networks:
      - proxy

networks:
  proxy:
    external: true
